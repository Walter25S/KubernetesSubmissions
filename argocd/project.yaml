# The ArgoCD application of the project (exercise 4.8): it watches project/k3d in the main branch and
# keeps the namespace "project" of the local cluster equal to it. The Secrets (database password, URL of
# the chat service) are not in Git: they are created in the cluster by hand and ArgoCD does not touch them.
#   kubectl apply -n argocd -f argocd/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Walter25S/KubernetesSubmissions
    targetRevision: main
    path: project/k3d
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
