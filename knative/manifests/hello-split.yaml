# "Traffic splitting" of the guide (exercise 5.6): a change of the template makes a new revision (hello-00002); the
# traffic is split 50 / 50 between the old and the new one. Apply it after hello.yaml.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative"
  traffic:
    - revisionName: hello-00001
      percent: 50
    - latestRevision: true
      percent: 50
