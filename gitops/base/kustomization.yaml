apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The project for ONE namespace (exercise 4.9). The two environments, staging and production, are built from
# this base plus an overlay (../overlays/staging, ../overlays/production) that sets what is different. The
# namespace is set by the overlay: everything here says "project" and the overlay moves it.
resources:
  - ../../project/base # the namespace, a LimitRange, a ResourceQuota and todo_app, todo_backend, todo_cronjob
  - ../../broadcaster
  - pvc.yaml
  - ingress.yaml

patches:
  # the backend publishes the events of the todos to NATS
  - path: backend-nats.yaml
