name: GitOps staging

# Every commit to main that changes the code of the project is deployed to STAGING (exercise 4.9): the
# workflow builds the four images, publishes them and writes their tags in the overlay of staging,
# in the repository. ArgoCD (application project-staging, which follows main) applies that commit.
on:
  push:
    branches:
      - main
    # only when the code of an image changes (not when this workflow commits the overlay)
    paths:
      - todo_app/**
      - todo_backend/**
      - todo_cronjob/**
      - broadcaster/**

permissions:
  contents: write # to commit the overlay

concurrency:
  group: gitops-staging
  cancel-in-progress: false

jobs:
  build-publish-release:
    name: Build, push, release to staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # image name -> folder: todo-app -> todo_app ... The tag is the commit SHA, unique for every build
      - name: Build and publish the images
        run: |-
          for IMAGE in todo-app todo-backend todo-cronjob broadcaster; do
            docker build --tag "wallas25/$IMAGE:$GITHUB_SHA" "${IMAGE//-/_}"
            docker push "wallas25/$IMAGE:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images in staging
        run: |-
          cd gitops/overlays/staging
          for IMAGE in todo-app todo-backend todo-cronjob broadcaster; do
            kustomize edit set image "wallas25/$IMAGE=wallas25/$IMAGE:$GITHUB_SHA"
          done

      - name: Commit the overlay
        uses: EndBug/add-and-commit@v10
        with:
          add: gitops/overlays/staging/kustomization.yaml
          message: "staging: release ${{ github.sha }}"
          pull: "--rebase --autostash"
