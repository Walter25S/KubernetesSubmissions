name: Log output (GitOps)

# GitOps for "Log output" (exercise 4.7). This workflow does NOT deploy anything to the cluster: it
# builds and publishes the images and writes the new image tags in log_output/kustomization.yaml, in
# the repository. ArgoCD, running in the cluster, sees that commit and updates the application.
#
#   code change -> this workflow -> image in Docker Hub + commit of the tags -> ArgoCD pulls and deploys
on:
  push:
    branches:
      - main
    # only when the code of the images changes (not when this workflow commits kustomization.yaml)
    paths:
      - log_output/writer/**
      - log_output/reader/**

permissions:
  contents: write # to commit kustomization.yaml

concurrency:
  group: log-output-gitops
  cancel-in-progress: false

jobs:
  build-publish-release:
    name: Build, push, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # the commit SHA is a unique tag: every build is a new image, and the tag says what code it has
      - name: Build and publish the images
        run: |-
          docker build --tag "wallas25/log-output-writer:$GITHUB_SHA" log_output/writer
          docker build --tag "wallas25/log-output-reader:$GITHUB_SHA" log_output/reader
          docker push "wallas25/log-output-writer:$GITHUB_SHA"
          docker push "wallas25/log-output-reader:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images
        run: |-
          cd log_output
          kustomize edit set image "wallas25/log-output-writer=wallas25/log-output-writer:$GITHUB_SHA"
          kustomize edit set image "wallas25/log-output-reader=wallas25/log-output-reader:$GITHUB_SHA"

      - name: Commit kustomization.yaml
        uses: EndBug/add-and-commit@v10
        with:
          add: log_output/kustomization.yaml
          message: "log_output: release ${{ github.sha }}"
          pull: "--rebase --autostash"
