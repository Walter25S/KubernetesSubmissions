name: Log output (GitOps)

# GitOps for "Log output" (exercises 4.7 and 4.10). The code is in this repository; the configuration that runs in the
# cluster is in Walter25S/KubernetesSubmissions-config (folder log-output). The workflow builds and publishes the images and
# writes their tags there. ArgoCD, running in the cluster, sees that commit and updates the application.
#
#   code change -> this workflow -> image in Docker Hub + commit of the tags in the config repository -> ArgoCD
on:
  push:
    branches:
      - main
    paths:
      - log_output/writer/**
      - log_output/reader/**

permissions:
  contents: read

concurrency:
  group: log-output-gitops
  cancel-in-progress: false

jobs:
  build-publish-release:
    name: Build, push, release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the images
        run: |-
          docker build --tag "wallas25/log-output-writer:$GITHUB_SHA" log_output/writer
          docker build --tag "wallas25/log-output-reader:$GITHUB_SHA" log_output/reader
          docker push "wallas25/log-output-writer:$GITHUB_SHA"
          docker push "wallas25/log-output-reader:$GITHUB_SHA"

      - name: Checkout the configuration repository
        uses: actions/checkout@v6
        with:
          repository: Walter25S/KubernetesSubmissions-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use the new images
        run: |-
          cd config/log-output
          kustomize edit set image "wallas25/log-output-writer=wallas25/log-output-writer:$GITHUB_SHA"
          kustomize edit set image "wallas25/log-output-reader=wallas25/log-output-reader:$GITHUB_SHA"

      - name: Commit to the configuration repository
        run: |-
          cd config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log-output/kustomization.yaml
          git commit -m "log-output: release $GITHUB_SHA of $GITHUB_REPOSITORY"
          git pull --rebase origin main
          git push origin HEAD:main
