apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # <plural>.<group>
  name: dummysites.stable.dwk
spec:
  group: stable.dwk
  scope: Namespaced
  names:
    kind: DummySite
    plural: dummysites
    singular: dummysite
    shortNames:
      - dsite
  versions:
    - name: v1
      served: true
      storage: true
      # the controller writes the result in .status, which users can not change through the spec
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - website_url
              properties:
                website_url:
                  type: string
                  description: The page that is copied, for example https://example.com/
                  pattern: '^https?://.+'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                message:
                  type: string
                bytes:
                  type: integer
                fetchedAt:
                  type: string
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.website_url
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Bytes
          type: integer
          jsonPath: .status.bytes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
