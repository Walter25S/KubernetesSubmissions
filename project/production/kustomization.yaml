apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production (the main branch, namespace "project") = the GKE environment plus what only
# production has: the daily backup of the database to Cloud Storage (exercise 3.10).
# The environments of the other branches use project/gke, without the backup.
resources:
  - ../gke
  - ../../todo_backup
