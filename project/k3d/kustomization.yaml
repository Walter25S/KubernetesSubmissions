apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local k3d cluster: the local PersistentVolume and the Traefik Ingress, plus the broadcaster and
# the NATS settings of the backend (exercise 4.6). NATS itself is installed with Helm, see
# ../../broadcaster/README.md. The Secret of the broadcaster is created by hand.
resources:
  - ../base
  - ../../volumes
  - ../../broadcaster
  - ingress.yaml

patches:
  - path: todo-backend-nats.yaml
