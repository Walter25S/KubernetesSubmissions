apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local k3d cluster: the local PersistentVolume and the Traefik Ingress, plus the broadcaster and
# the NATS settings of the backend (exercise 4.6). NATS itself is installed with Helm, see
# ../../broadcaster/README.md. The Secret of the broadcaster is created by hand.
resources:
  - ../base
  - ../../volumes
  - ../../broadcaster
  - ingress.yaml

patches:
  - path: todo-backend-nats.yaml

# The images that are running (exercise 4.8). The CI workflow .github/workflows/project-gitops.yaml
# changes these tags with `kustomize edit set image` and commits the file: that commit is what
# updates the cluster, through ArgoCD.
images:
  - name: wallas25/todo-app
    newTag: "4.5"
  - name: wallas25/todo-backend
    newTag: "4.6"
  - name: wallas25/todo-cronjob
    newTag: "2.9"
  - name: wallas25/broadcaster
    newTag: "4.6"
