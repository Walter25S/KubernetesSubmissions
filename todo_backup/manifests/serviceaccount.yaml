# The Kubernetes identity of the backup job. The annotation links it to a Google service
# account (Workload Identity): the pod acts as that account without any key being stored.
# The other half of the link is a binding in Google Cloud, see ../README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-backup
  namespace: project
  annotations:
    iam.gke.io/gcp-service-account: todo-backup-sa@project-cbd387a3-5a90-4d0f-84b.iam.gserviceaccount.com
