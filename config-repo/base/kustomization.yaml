apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The project for ONE namespace. Everything here says "project"; the overlay of each environment moves it.
resources:
  - namespace.yaml
  - limitrange.yaml
  - resourcequota.yaml
  - todo-app
  - todo-backend
  - todo-cronjob
  - broadcaster
  - pvc.yaml
  - ingress.yaml

patches:
  # the backend publishes the events of the todos to NATS
  - path: backend-nats.yaml
