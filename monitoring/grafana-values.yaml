# Grafana with Loki as the default datasource.
# The admin password is not set here: the chart generates one and stores it in
# the Secret "grafana" (see README.md for how to read it).
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: true
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: "1"
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
