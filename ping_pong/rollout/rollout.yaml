# Canary release of ping-pong with Argo Rollouts (exercise 4.4). It REPLACES the Deployment of
# ../manifests/deployment.yaml (do not run both): the pod template is the same.
#
# The new version is given to 25% of the pods, then the analysis of namespace-cpu runs for 5 minutes
# and, if it passes, the release continues to 50% and then to all the pods. If the analysis fails the
# rollout is aborted and the pods go back to the previous version.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ping-pong
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: namespace-cpu
        - setWeight: 50
        - pause:
            duration: 30s
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: wallas25/ping-pong:4.1
          envFrom:
            - configMapRef:
                name: ping-pong-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          # Ready only when the application has a connection to the database (exercise 4.1)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
