# GKE Ingress health-checks every backend with GET / by default. ping-pong answers
# 404 on / (it only serves /pingpong and /pings), so it would be marked UNHEALTHY and
# the load balancer would not send traffic to it. This tells GKE to check /pings,
# which answers 200. The Service points to it with an annotation (see service.yaml).
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ping-pong-backendconfig
  namespace: exercises
spec:
  healthCheck:
    type: HTTP
    requestPath: /pings
