# GKE: the Ingress needs a NodePort Service (exercise 3.2; the NodePort is not
# reachable from outside, only the Ingress is). It replaces ../manifests/service.yaml
# (ClusterIP) on GKE: do not apply both, they have the same name.
# In exercise 3.1 this file was a LoadBalancer Service.
apiVersion: v1
kind: Service
metadata:
  name: ping-pong-svc
  namespace: exercises
  annotations:
    # health check on /pings instead of / (see backendconfig.yaml)
    cloud.google.com/backend-config: '{"default": "ping-pong-backendconfig"}'
spec:
  type: NodePort
  selector:
    app: ping-pong
  ports:
    - port: 2346
      protocol: TCP
      targetPort: 3000
