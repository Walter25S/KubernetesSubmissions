apiVersion: v1
kind: ConfigMap
metadata:
  name: ping-pong-config
  namespace: exercises
data:
  PORT: "3000"
  # the headless service of the database (see statefulset.yaml)
  DB_HOST: postgres-svc
  DB_PORT: "5432"
  DB_NAME: pingpong
  DB_USER: pingpong
  DB_RETRY_DELAY_MS: "2000"
  DB_CONNECT_TIMEOUT_MS: "3000"
