apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: project
data:
  PORT: "3000"
  # picture cache; the directory must be inside the volume mounted by the deployment
  IMAGE_DIR: /usr/src/app/files/todo
  IMAGE_URL: https://picsum.photos/1200
  IMAGE_TTL_MS: "600000"
  # the todo-backend service (http://<service>.<namespace>:<port>)
  TODO_BACKEND_URL: http://todo-backend-svc:2345
  REQUEST_TIMEOUT_MS: "3000"
  MAX_TODO_LENGTH: "140"
  MAX_BODY_BYTES: "10240"
  # only for testing: lets POST /shutdown stop the container
  ENABLE_SHUTDOWN: "true"
