apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: todo-app
          image: wallas25/todo-app:2.2
          env:
            - name: PORT
              value: "3000"
            - name: ENABLE_SHUTDOWN
              value: "true"
            - name: TODO_BACKEND_URL
              value: http://todo-backend-svc:2345
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
