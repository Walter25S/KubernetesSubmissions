apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  # The picture cache is a ReadWriteOnce volume: it can be mounted by one node at a time,
  # so the new pod cannot start while the old one still has it (RollingUpdate would fail
  # with a Multi-Attach error on GKE). Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-cache
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: todo-app
          image: wallas25/todo-app:2.6
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: image-cache
              mountPath: /usr/src/app/files
          # measured with `kubectl top pods`: 2-10m CPU and 22-26Mi of memory
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
